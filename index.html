<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>時計修理工房</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 工房を歩いているときの表示 -->
    <div id="hud">
      <div class="hud-left"><span id="hud-day"></span><span id="hud-money"></span><span id="hud-rep"></span></div>
      <div class="hud-right" id="hud-job"></div>
    </div>
    <div id="crosshair" class="show"></div>
    <div id="prompt"></div>

    <!-- タッチ操作用（タブレット） -->
    <div id="touch-ui">
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button id="btn-interact">調べる</button>
      <button id="btn-menu" aria-label="メニュー">☰</button>
    </div>

    <!-- 作業モードの表示 -->
    <div id="bench-ui">
      <div id="steps">
        <button id="steps-toggle" title="手順の表示を開く／閉じる">手順</button>
        <div id="steps-body">
          <div id="steps-title"></div>
          <div class="progress"><div id="steps-progress"></div></div>
          <div id="quality-now"></div>
          <ol id="steps-list"></ol>
        </div>
      </div>
      <div id="explain"></div>
      <div id="bench-controls">
        <button id="bc-flip" title="表裏を返す（F）">表裏<small>F</small></button>
        <button id="bc-left" title="左に回す">⟲</button>
        <button id="bc-right" title="右に回す">⟳</button>
        <button id="bc-zoomin" title="ズーム">＋</button>
        <button id="bc-zoomout" title="ズームアウト">−</button>
        <button id="bc-loupe" title="ルーペ（L）">ルーペ<small>L</small></button>
        <button id="bc-reset" title="視点を戻す（R）">視点<small>R</small></button>
        <button id="bc-explain" title="解説（H）">解説<small>H</small></button>
        <button id="bc-guide" title="ガイド切替（G）">ガイド<small>G</small></button>
        <button id="bc-stand" class="stand" title="席を立つ（X）">席を立つ<small>X</small></button>
      </div>
      <div id="tool-area">
        <div id="tool-desc"></div>
        <div id="hotbar-row">
          <div id="toolbar"></div>
          <button id="btn-toolbox" title="道具箱（Tab）">道具箱<small>Tab</small></button>
        </div>
      </div>
      <div id="toolbox">
        <div class="toolbox-head">道具箱<span>選ぶと持ち替えて、下のホットバーにも入ります</span><button id="toolbox-close">閉じる</button></div>
        <div id="toolbox-list"></div>
      </div>
    </div>
    <div id="part-label"></div>
    <div id="minigame"></div>

    <div id="modal"></div>
    <div id="toasts"></div>

    <!-- タイトル -->
    <div id="title">
      <div class="title-box">
        <div class="title-sub">WATCH REPAIR WORKSHOP</div>
        <h1>時計修理工房</h1>
        <p>お客さんの大切な時計を、本物の職人の手順で直していきましょう。</p>
        <div class="title-buttons">
          <button id="btn-continue" class="primary">つづきから</button>
          <button id="btn-new">はじめから</button>
        </div>
        <label class="title-control">操作方法：
          <select id="title-control">
            <option value="auto">自動（端末に合わせる）</option>
            <option value="mouse">マウス・キーボード（タッチパッド）</option>
            <option value="touch">タッチ（タブレット）</option>
          </select>
        </label>
        <div class="controls">
          <div><b>マウス</b>　WASD：移動　マウス：見回す　E：調べる　Esc：一時停止</div>
          <div><b>タッチ</b>　左下スティック：移動　ドラッグ：見回す　［調べる］ボタン　☰：メニュー</div>
          <div><b>作業台</b>　クリック／タップ2回：道具を使う　ドラッグ：回す　ピンチ・ホイール：ズーム</div>
        </div>
        <p class="ver">第3段階：お金・ショップ端末・道具のグレードアップ</p>
      </div>
    </div>

    <!-- 一時停止 -->
    <div id="pause">
      <div class="pause-box">
        <h2>一時停止中</h2>
        <p id="pause-hint">画面をクリックすると再開します</p>
        <div class="pause-settings">
          <label>手順ガイド：
            <select id="guide-select">
              <option value="auto">自動（同じ作業を3回こなすまで表示）</option>
              <option value="on">いつも表示</option>
              <option value="off">表示しない（上級モード）</option>
            </select>
          </label>
          <label>操作方法：
            <select id="control-select">
              <option value="auto">自動（端末に合わせる）</option>
              <option value="mouse">マウス・キーボード（タッチパッド）</option>
              <option value="touch">タッチ（タブレット）</option>
            </select>
          </label>
          <button id="btn-reset">セーブデータを消す</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
